<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AUTOTROL · Mapa de Robos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg:#0f1923; --card:#16222f; --border:#1e3048;
      --text:#e8edf2; --text-muted:#7a92a8;
      --orange:#E87D2B; --orange-dim:rgba(232,125,43,.15);
      --yes:#22c55e; --no:#ef4444;
      --topbar-h:54px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}

    /* ── TOPBAR ── */
    .topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);
      background:var(--card);border-bottom:1px solid var(--border);
      display:flex;align-items:center;padding:0 18px;gap:14px;z-index:1000;
      box-shadow:0 2px 12px rgba(0,0,0,.3)}
    .logo-wrap img{height:30px;display:block}
    .sep{width:1px;height:24px;background:var(--border)}
    .topbar-title{display:flex;flex-direction:column;gap:1px}
    .topbar-title strong{font-size:13px;font-weight:700;color:var(--text);letter-spacing:.3px}
    .topbar-title span{font-size:10px;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase}
    .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}

    /* pills */
    .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;
      border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
    .pill.ok{background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.25)}
    .pill.loading{background:rgba(232,125,43,.12);color:var(--orange);border:1px solid rgba(232,125,43,.25)}
    .pill.error{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25)}
    #syncStatus{cursor:pointer;user-select:none;transition:opacity .15s,transform .1s}
    #syncStatus:hover{opacity:.8}
    #syncStatus:active{transform:scale(.96)}

    /* stat pills */
    .stat-pill{background:var(--bg);border:1px solid var(--border);
      border-radius:8px;padding:4px 12px;text-align:center;min-width:64px}
    .stat-pill small{font-size:10px;color:var(--text-muted);display:block;line-height:1.3}
    .stat-pill strong{font-size:16px;font-weight:700;color:var(--text);display:block;line-height:1.2}

    /* nav link */
    .nav-link{display:inline-flex;align-items:center;gap:5px;font-size:11px;
      color:var(--text-muted);text-decoration:none;padding:5px 10px;
      border:1px solid var(--border);border-radius:6px;transition:color .15s,border-color .15s}
    .nav-link:hover{color:var(--text);border-color:var(--text-muted)}
    .nav-link svg{flex-shrink:0}

    /* ── MAP ── */
    #map{position:fixed;top:var(--topbar-h);left:0;right:0;bottom:0}

    /* ── LOADING OVERLAY ── */
    #loadOverlay{position:fixed;top:var(--topbar-h);left:0;right:0;bottom:0;
      background:rgba(15,25,35,.88);display:flex;align-items:center;justify-content:center;
      z-index:500;flex-direction:column;gap:14px;backdrop-filter:blur(2px)}
    #loadOverlay.hidden{display:none}
    .spinner{width:38px;height:38px;border:3px solid var(--border);
      border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #loadOverlay p{color:var(--text-muted);font-size:13px}

    /* ── LEAFLET POPUP OVERRIDE ── */
    .leaflet-popup-content-wrapper{
      background:var(--card) !important;border:1px solid var(--border) !important;
      border-radius:12px !important;box-shadow:0 10px 40px rgba(0,0,0,.6) !important;
      color:var(--text) !important;padding:0 !important;overflow:hidden}
    .leaflet-popup-tip-container{margin-top:-1px}
    .leaflet-popup-tip{background:var(--border) !important}
    .leaflet-popup-content{margin:0 !important;width:248px !important}
    .leaflet-popup-close-button{color:var(--text-muted) !important;top:8px !important;right:10px !important;font-size:16px !important}
    .leaflet-popup-close-button:hover{color:var(--text) !important}

    /* ── POPUP CONTENT ── */
    .mp-header{padding:12px 14px 10px;border-bottom:1px solid var(--border)}
    .mp-street{font-size:14px;font-weight:700;color:var(--text);line-height:1.25}
    .mp-altura{font-size:11px;color:var(--orange);font-weight:600;margin-top:3px}
    .mp-photo{width:100%;height:148px;object-fit:cover;display:block;background:var(--bg)}
    .mp-nophoto{width:100%;height:80px;display:flex;align-items:center;justify-content:center;
      background:var(--bg);color:var(--text-muted);font-size:11px;gap:6px}
    .mp-footer{padding:8px 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .mp-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;
      text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
    .mp-badge.ok{background:rgba(34,197,94,.15);color:var(--yes)}
    .mp-badge.rep{background:rgba(239,68,68,.15);color:var(--no)}
    .mp-badge.def{background:var(--orange-dim);color:var(--orange)}
    .mp-fecha{font-size:10px;color:var(--text-muted)}
    .mp-obs{padding:0 14px 10px;font-size:10.5px;color:var(--text-muted);line-height:1.45}

    /* ── CLUSTER ── */
    .marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{
      background-color:rgba(232,125,43,.18) !important}
    .marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{
      background-color:rgba(232,125,43,.82) !important;
      color:#fff !important;font-weight:700 !important;font-size:12px !important}

    /* ── LIGHTBOX ── */
    #lightbox{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);
      display:none;align-items:center;justify-content:center;
      backdrop-filter:blur(4px);cursor:zoom-out;animation:lbIn .18s ease}
    #lightbox.open{display:flex}
    @keyframes lbIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
    #lbImg{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:6px;
      box-shadow:0 20px 80px rgba(0,0,0,.9);cursor:default;transition:opacity .2s}
    #lbImg.loading{opacity:.3}
    #lbClose{position:absolute;top:16px;right:20px;background:rgba(255,255,255,.12);
      border:none;color:#fff;font-size:22px;line-height:1;width:36px;height:36px;
      border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:background .15s}
    #lbClose:hover{background:rgba(255,255,255,.25)}
    #lbCaption{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
      background:rgba(0,0,0,.6);color:rgba(255,255,255,.8);font-size:12px;
      padding:5px 14px;border-radius:20px;white-space:nowrap;backdrop-filter:blur(4px)}
    #lbSpinner{position:absolute;width:36px;height:36px;border:3px solid rgba(255,255,255,.15);
      border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;
      display:none}
    #lbSpinner.vis{display:block}

    .mp-photo{cursor:zoom-in}
    .mp-photo:hover{opacity:.88;transition:opacity .15s}

    /* Leaflet dark attribution */
    .leaflet-control-attribution{
      background:rgba(15,25,35,.75) !important;color:var(--text-muted) !important;font-size:9px !important}
    .leaflet-control-attribution a{color:var(--text-muted) !important}
    .leaflet-control-zoom a{
      background:var(--card) !important;color:var(--text) !important;
      border-color:var(--border) !important}
    .leaflet-control-zoom a:hover{background:var(--border) !important}
  </style>
</head>

<script>
/* ── CONFIG ── */
const SHEET_ID  = '1dmTytcf2ebJsoORgoboK8ja7aaNUaBbMdgl8r3VpRmQ';
const SHEET_GID = '1646055869';
const CSV_URL   = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`;

let map, markerLayer;

/* ── MAP INIT ── */
function initMap() {
  map = L.map('map', {
    center: [-32.9, -60.7],
    zoom: 13,
    zoomControl: true,
    preferCanvas: true,
  });

  // Esri Dark Gray Canvas – gratuito, sin API key
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: '&copy; <a href="https://www.esri.com">Esri</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 16
  }).addTo(map);

  markerLayer = L.markerClusterGroup({
    maxClusterRadius: 60,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    iconCreateFunction: c => {
      const n = c.getChildCount();
      const sz = n < 10 ? 34 : n < 100 ? 40 : 46;
      return L.divIcon({
        html: `<div style="
          width:${sz}px;height:${sz}px;border-radius:50%;
          background:rgba(232,125,43,.85);border:2px solid rgba(255,255,255,.25);
          display:flex;align-items:center;justify-content:center;
          color:#fff;font-weight:700;font-size:${sz<40?12:14}px;
          box-shadow:0 2px 8px rgba(0,0,0,.5)">${n}</div>`,
        className: '',
        iconSize: [sz, sz],
        iconAnchor: [sz/2, sz/2]
      });
    }
  });
  map.addLayer(markerLayer);
}

/* ── HELPERS ── */
function parseDriveId(val) {
  if (!val || !val.trim()) return null;
  const m = val.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9_-]{25,}$/.test(val.trim())) return val.trim();
  return null;
}

function parseCoord(v) {
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

function parseGPScombined(v) {
  if (!v) return null;
  const parts = v.trim().split(/[\s,]+/).map(parseFloat).filter(n => !isNaN(n));
  if (parts.length < 2) return null;
  const [a, b] = parts;
  if (Math.abs(a) <= 90 && Math.abs(b) <= 180) return [a, b];
  if (Math.abs(b) <= 90 && Math.abs(a) <= 180) return [b, a];
  return null;
}

function accionClass(v) {
  if (!v) return 'def';
  const a = v.toLowerCase();
  if (a.includes('ok') || a.includes('conforme') || a.includes('buena') || a.includes('bien')) return 'ok';
  if (a.includes('repar') || a.includes('urgente') || a.includes('mal') || a.includes('baja')) return 'rep';
  return 'def';
}

function pinIcon(cls) {
  const colors = { ok:'#22c55e', rep:'#ef4444', def:'#E87D2B' };
  const fill = colors[cls] || '#E87D2B';
  return L.divIcon({
    className: '',
    html: `<svg width="24" height="32" viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 20 12 20S24 21 24 12C24 5.37 18.63 0 12 0z"
        fill="${fill}" stroke="rgba(0,0,0,.35)" stroke-width="1"/>
      <circle cx="12" cy="12" r="4.5" fill="rgba(255,255,255,.9)"/>
    </svg>`,
    iconSize: [24, 32],
    iconAnchor: [12, 32],
    popupAnchor: [0, -32]
  });
}

function buildPopup(row, col) {
  const calle  = (row[col.calle]  || '(sin calle)').trim();
  const altura = (row[col.altura] || '').trim();
  const accion = (row[col.accion] || '').trim();
  const fecha  = (row[col.fecha]  || '').trim();
  const obs    = (row[col.obs]    || '').trim();
  const fotoId = col.foto != null ? parseDriveId(row[col.foto]) : null;
  const aClass = accionClass(accion);

  const caption = [calle, altura ? `Altura ${altura}` : ''].filter(Boolean).join(' · ');
  const photo = fotoId
    ? `<img class="mp-photo" src="https://drive.google.com/thumbnail?id=${fotoId}&sz=w248-h148"
         alt="Foto" loading="lazy" title="Clic para ampliar"
         onclick="openLightbox('${fotoId}','${caption.replace(/'/g,"\\'")}',event)"
         onerror="this.style.display='none';document.getElementById('noph-${fotoId}').style.display='flex'">`
      + `<div id="noph-${fotoId}" class="mp-nophoto" style="display:none">
           <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4">
             <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
             <polyline points="21 15 16 10 5 21"/>
           </svg>Sin foto disponible</div>`
    : `<div class="mp-nophoto">
         <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4">
           <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
           <polyline points="21 15 16 10 5 21"/>
         </svg>Sin foto disponible</div>`;

  const footer = (accion || fecha) ? `
    <div class="mp-footer">
      ${accion ? `<span class="mp-badge ${aClass}">${accion}</span>` : ''}
      ${fecha  ? `<span class="mp-fecha">${fecha}</span>` : ''}
    </div>` : '';

  const obsHtml = obs
    ? `<div class="mp-obs">${obs.length > 130 ? obs.substring(0,130)+'…' : obs}</div>` : '';

  return `<div>
    <div class="mp-header">
      <div class="mp-street">${calle}</div>
      ${altura ? `<div class="mp-altura">Altura ${altura}</div>` : ''}
    </div>
    ${photo}
    ${footer}
    ${obsHtml}
  </div>`;
}

/* ── STATUS ── */
function setStatus(type, txt) {
  const el = document.getElementById('syncStatus');
  el.className = 'pill ' + type;
  if (type === 'ok') {
    el.innerHTML = `● En línea &nbsp;<svg style="opacity:.5;vertical-align:middle" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`;
  } else {
    el.textContent = txt;
  }
}

/* ── LOAD DATA ── */
function loadData() {
  document.getElementById('loadOverlay').classList.remove('hidden');
  setStatus('loading', '⏳ Cargando…');
  markerLayer.clearLayers();
  document.getElementById('statTotal').textContent = '—';
  document.getElementById('statMapped').textContent = '—';

  let headers = null;
  let col = {};
  const bounds = [];
  let total = 0;
  let mapped = 0;

  Papa.parse(CSV_URL, {
    download: true,
    skipEmptyLines: true,
    step: (result) => {
      const row = result.data;

      // First row → detect columns
      if (!headers) {
        headers = row.map(h => h.replace(/^﻿/, '').trim().toLowerCase());
        // Detect indices dynamically
        const find = (...keys) => {
          for (const k of keys) {
            const i = headers.findIndex(h => h.includes(k));
            if (i >= 0) return i;
          }
          return null;
        };
        col = {
          calle:  find('calle', 'direc'),
          altura: find('altura', 'numer'),
          accion: find('acción', 'accion'),
          fecha:  find('última', 'ultima', 'fecha'),
          obs:    find('observac'),
          foto:   find('foto estado', 'foto'),
          lat:    find('lat'),
          lon:    find('lon'),
          gps:    find('gps'),
        };
        return;
      }

      total++;

      // Get coordinates
      let coords = null;
      if (col.lat != null && col.lon != null) {
        const lat = parseCoord(row[col.lat]);
        const lon = parseCoord(row[col.lon]);
        if (lat !== null && lon !== null && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
          coords = [lat, lon];
        }
      }
      if (!coords && col.gps != null) {
        coords = parseGPScombined(row[col.gps]);
      }
      if (!coords) return;

      mapped++;
      bounds.push(coords);

      const cls = accionClass(row[col.accion] || '');
      const marker = L.marker(coords, { icon: pinIcon(cls) });
      marker.bindPopup(() => buildPopup(row, col), {
        maxWidth: 280,
        minWidth: 248,
        closeButton: true,
      });
      markerLayer.addLayer(marker);
    },
    complete: () => {
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statMapped').textContent = mapped;
      document.getElementById('loadOverlay').classList.add('hidden');
      setStatus('ok', '');
      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
      }
    },
    error: (err) => {
      document.getElementById('loadOverlay').classList.add('hidden');
      setStatus('error', '✕ Sin conexión');
      console.error('CSV error:', err);
    }
  });
}

/* ── LIGHTBOX ── */
function openLightbox(driveId, caption, e) {
  if (e) e.stopPropagation();
  const lb  = document.getElementById('lightbox');
  const img = document.getElementById('lbImg');
  const sp  = document.getElementById('lbSpinner');
  const cap = document.getElementById('lbCaption');

  img.src = '';
  img.classList.add('loading');
  sp.classList.add('vis');
  cap.textContent = caption || '';
  lb.classList.add('open');

  // Try full resolution first, fallback to large thumbnail
  const fullUrl = `https://drive.google.com/thumbnail?id=${driveId}&sz=w1920-h1440`;
  img.onload = () => { img.classList.remove('loading'); sp.classList.remove('vis'); };
  img.onerror = () => {
    // fallback: view URL
    img.src = `https://drive.google.com/uc?export=view&id=${driveId}`;
    img.onerror = () => { img.classList.remove('loading'); sp.classList.remove('vis'); };
  };
  img.src = fullUrl;
}

function closeLightbox() {
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lbImg');
  lb.classList.remove('open');
  img.src = ''; // free memory
}

// Close lightbox with Escape key
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

/* ── BOOT ── */
initMap();
loadData();
</script>
